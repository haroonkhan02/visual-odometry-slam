name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Tests use synthetic TUM-format sequences and trajectories: no dataset or GPU.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy opencv-python-headless matplotlib pyyaml tqdm pytest ruff
          pip install -e . --no-deps  # avoid the GUI opencv build on the runner
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
