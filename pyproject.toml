[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-odometry-slam"
version = "0.1.0"
description = "Feature-based visual odometry (monocular and RGB-D) with drift analysis and loop closure, evaluated on the TUM RGB-D benchmark with ATE and RPE."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad Haroon Khan" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vo-download = "vo_slam.download:main"
vo-check = "vo_slam.dataset_stats:main"
vo-run = "vo_slam.run:main"
vo-eval = "vo_slam.evaluate:main"
vo-analyse = "vo_slam.analysis:main"
vo-demo = "vo_slam.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
